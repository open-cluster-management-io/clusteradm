# Copyright Contributors to the Open Cluster Management project

name: Create Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write
 
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7
        with:
          go-version-file: go.mod
      - name: Build project
        run: |
          make build-bin
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            bin/clusteradm_darwin_amd64.tar.gz
            bin/clusteradm_darwin_arm64.tar.gz
            bin/clusteradm_linux_amd64.tar.gz
            bin/clusteradm_linux_arm64.tar.gz
            bin/clusteradm_linux_ppc64le.tar.gz
            bin/clusteradm_linux_s390x.tar.gz
            bin/clusteradm_windows_amd64.zip
          draft: true
          prerelease: false
          generate_release_notes: true
